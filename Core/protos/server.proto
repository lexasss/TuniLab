syntax = "proto3";

package GrpcServer;

import "protos/common.proto";
import "google/protobuf/empty.proto";

service Dispatcher {
	rpc IsAvailable (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns the core version. Clients must check the version and do not continue
    // if server's and they own core vesions differ
	rpc GetCoreVersion (google.protobuf.Empty) returns (Version) {}
}

message Version {
	string value = 1;
	string buildTime = 2;
}