syntax = "proto3";

package GrpcServer;

import "protos/common.proto";
import "google/protobuf/empty.proto";

service Dispatcher {
	rpc IsAvailable (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns the version and compilation time of the Core binaries.
	// Clients must check the version and not continue
	// if the server's and their own Core versions differ.
	// If only timestamps differ, it may also not be safe to continue.
	rpc GetCoreVersion (google.protobuf.Empty) returns (Version) {}
}

message Version {
	string value = 1;
	string buildTime = 2;
}