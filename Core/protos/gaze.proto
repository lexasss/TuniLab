syntax = "proto3";

package Gaze;

import "protos/common.proto";
import "google/protobuf/empty.proto";

service Dispatcher {
	rpc IsAvailable (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is streaming data to clients
	rpc IsStreamingData (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is logging gaze data to a file set with SetLogFileName
	rpc IsLogging (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is connected to an eye tracking device
	rpc IsConnected (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the tracker calibration routine is in progress
	rpc IsCalibrating (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the tracker was calibrated already
	rpc IsCalibrated (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the tracker is tracking eyes
	rpc IsTracking (google.protobuf.Empty) returns (Common.Bool) {}

	// Call this function before calling Start if you need the gaze data to be logged to a file
	rpc SetLogFileName (Common.String) returns (Common.Bool) {}

	// Initializes gaze data reading stream, but the gaze data is not polling to clients
	// until Start is called
	rpc ReadData (google.protobuf.Empty) returns (stream Sample) {}

	// Initializes event stream (see "message Event" for the list of events). 
	rpc ReadEvents (google.protobuf.Empty) returns (stream Event) {}

	// Enables gaze data streaming, and possibly saving it to a file
	// (has no effect if ReadData was not called yet)
	rpc Start (google.protobuf.Empty) returns (google.protobuf.Empty) {}
	rpc Stop (google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

message Status {
	bool isConnected = 1;
	bool isCalibrating = 2;
	bool IsCalibrated = 3;
	bool IsTracking = 4;
}

message Sample {
	double timestamp = 1;
	double eyeX = 2;
	double eyeY = 3;
	double eyeXL = 4;
	double eyeYL = 5;
	double eyeXR = 6;
	double eyeYR = 7;
	double camXL = 8;
	double camYL = 9;
	double camXR = 10;
	double camYR = 11;
	enum Eye
	{
		None = 0;
		Left = 1;
		Right = 2;
		Both = 3;
	}
	Eye validEye = 12;
}

message Event {
	oneof value {
		Status status = 1;
	}
}