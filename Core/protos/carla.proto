syntax = "proto3";

package Carla;

import "protos/common.proto";
import "google/protobuf/empty.proto";

service Dispatcher {
	rpc IsAvailable (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is streaming telemetry to clients
	rpc IsStreamingData (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is logging telemetry to a file set with SetLogFileName
	rpc IsLogging (google.protobuf.Empty) returns (Common.Bool) {}

	// Call this function before calling Start if you need the data to be logged to a file
	rpc SetLogFileName (Common.String) returns (Common.Bool) {}

	// Returns all telemetry fields
	rpc GetTelemetryFields (google.protobuf.Empty) returns (Common.Strings) {}

	// Returns false if some fields were invalid
	rpc SetStreamFields (Common.Strings) returns (Common.Bool) {}
	rpc GetStreamFields (google.protobuf.Empty) returns (Common.Strings) {}

	// Initializes data reading stream, but the data is not polling to clients
	// until Start is called
	rpc ReadData (google.protobuf.Empty) returns (stream Data) {}

	// Initializes event stream (see "message Event" for the list of events). 
	rpc ReadEvents (google.protobuf.Empty) returns (stream Event) {}

	// Enables Carla telemetry streaming, and possibly saving it to a file
	// (has no effect if ReadData was not called yet)
	rpc Start (google.protobuf.Empty) returns (google.protobuf.Empty) {}
	rpc Stop (google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

message Data {
	map<string, float> values = 1;
}

message Event {
	oneof value {
		bool isConnected = 1;
	}
}