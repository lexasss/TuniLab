syntax = "proto3";

package LeapMotion;

import "protos/common.proto";
import "google/protobuf/empty.proto";

service Dispatcher {
	rpc IsAvailable (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is streaming data to clients
	rpc IsStreamingData (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is logging data to a file set with SetLogFileName
	rpc IsLogging (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is connected to a Leap Motion device
	rpc IsConnected (google.protobuf.Empty) returns (Common.Bool) {}

	// Sets hand tracking parameters that are used to detect isHandClose events
	rpc Configure (Configuration) returns (google.protobuf.Empty) {}

	// These fields are used only when the type is Custom

	// Call this function before calling Start if you need the data to be logged to a file
	rpc SetLogFileName (Common.String) returns (Common.Bool) {}

	// Initializes data reading stream, but the data is not polling to clients
	// until Start is called
	rpc ReadData (google.protobuf.Empty) returns (stream Sample) {}

	// Initializes event stream (see "message Event" for the list of events). 
	rpc ReadEvents (google.protobuf.Empty) returns (stream Event) {}

	// Enables data streaming, and possibly saving it to a file
	// (has no effect if ReadData was not called yet)
	rpc Start (google.protobuf.Empty) returns (google.protobuf.Empty) {}
	rpc Stop (google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

enum ConfigType {
	Default = 0;
	Ultrahaptics = 1;
	Custom = 2;
}

message Configuration {
	ConfigType config = 1;

	// These fields are used only when the type is Custom
	optional Common.Vector proximityBoxCorner1 = 2;
	optional Common.Vector proximityBoxCorner2 = 3;
	optional Common.Vector translation = 4;
	optional Common.Vector scale = 5;
}

message Sample {
	Common.Vector palm = 1;
	repeated Common.Vector fingertips = 2;
}

message Event {
	oneof value {
		bool isConnected = 1;
		bool isHandVisible = 2;
		bool isHandClose = 3;
	}
}