syntax = "proto3";

package Screen;

import "protos/common.proto";
import "google/protobuf/empty.proto";

service Dispatcher {
	rpc IsAvailable (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns a list of available screen
	rpc GetScreens (google.protobuf.Empty) returns (Screens) {}

	// Tries to upload a media file to the server, and returns the operation result.
	// Storing files in the server folder makes sense only if the client is running on another PC.
	rpc UploadFile(stream Common.UploadRequest) returns (Common.UploadResult);

	// Returns a list of files stored in the server's folder.
	rpc GetFileList(google.protobuf.Empty) returns (Common.Strings);

	// Returns the displayed media ID if it was displayed successfully
	rpc Show (Media) returns (Common.String) {}

	// Hides the media given int ID (or does nothing if such media is not displayed)
	rpc Close (Common.String) returns (google.protobuf.Empty) {}

	// Returns all media visible currently
	rpc GetVisibleMedias (google.protobuf.Empty) returns (Medias) {}

	// Initializes event stream (see "message Event" for the list of events). 
	rpc ReadEvents (google.protobuf.Empty) returns (stream Event) {}
}

message Screen {
	int32 id = 1;
	string name = 2;
	Common.Point origin = 3;
	Common.Size size = 4;
}

message Screens {
	repeated Screen items = 1;
}

message Event {
	oneof value {
		string hiddenMediaId = 1;
	}
}

message Media {
	int32 screenId = 1;
	string fileName = 2;
	Common.Point location = 3;
	optional Common.Size size = 4;
	optional int32 duration = 5;
}

message Medias {
	repeated Media items = 1;
}
