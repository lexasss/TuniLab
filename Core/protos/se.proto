syntax = "proto3";

package SmartEye;

import "protos/common.proto";
import "google/protobuf/empty.proto";

service Dispatcher {
	rpc IsAvailable (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is streaming data to clients
	rpc IsStreamingData (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is logging data to a file set with SetLogFileName
	rpc IsLogging (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns true if the service is connected to a SmartEye device
	rpc IsConnected (google.protobuf.Empty) returns (Common.Bool) {}

	// Call this function before calling Start if you need the gaze data to be logged to a file
	rpc SetLogFileName (Common.String) returns (Common.Bool) {}

	// Returns true if the SmartEye tracker was connected given IP and a port set in the configuration
	rpc Configure (Configuration) returns (Common.Bool) {}

	// Initializes gaze data reading stream, but the gaze data is not polling to clients
	// until Start is called
	rpc ReadData (google.protobuf.Empty) returns (stream Common.Vector) {}

	// Initializes event stream (see "message Event" for the list of events). 
	rpc ReadEvents (google.protobuf.Empty) returns (stream Event) {}

	// Enables gaze data streaming, and possibly saving it to a file
	// (has no effect if ReadData was not called yet)
	rpc Start (google.protobuf.Empty) returns (google.protobuf.Empty) {}
	rpc Stop (google.protobuf.Empty) returns (google.protobuf.Empty) {}
}

enum IntersectionSource {
	Gaze = 0;
	AI = 1;
}

enum PlaneMappingMode {
	Closest = 0;	// streaming only Intersection events
	All = 1;		// streaming only Intersections events
}

message Configuration {
	string ip = 1;
	int32 port = 2;
	IntersectionSource intersectionSource = 3;
	bool useFilteredData = 4;
	PlaneMappingMode planeMappingMode = 5;
}

message Intersection {
	string name = 1;
	Common.Vector gazePoint = 2;
}

message Intersections {
	repeated Intersection items = 1;
}

message Event {
	oneof value {
		bool isConnected = 2;
		Intersection intersection = 3;
		Intersections intersections = 4;
	}
}