syntax = "proto3";

package SoundPlayer;

import "protos/common.proto";
import "google/protobuf/empty.proto";

service Dispatcher {
	rpc IsAvailable (google.protobuf.Empty) returns (Common.Bool) {}

	// Returns a list of all not hidden sound devices
	rpc GetDevices (google.protobuf.Empty) returns (Devices) {}

	// Tries to upload an audio file to the server, and returns the operation result.
	// Storing files in the server folder makes sense only if the client is running on another PC.
	rpc UploadFile(stream Common.UploadRequest) returns (Common.UploadResult);

	// Returns a list of audio files stored in the server's folder.
	rpc GetFileList(google.protobuf.Empty) returns (Common.Strings);

	// Sets gains of each audio channel separately, each gain between 0 and 1.
	// The length of the map array must be equal to the number of enabled channels 
	// of the sound device to be used for playing audio 
	// (see channelEnablingMap in ToneDescription and FileDescription).
	// Set empty map to cancel the mapping.
	// The function can be called while a sound is playing, thus creating various effects.
	rpc SetChannelMap (ChannelMap) returns (google.protobuf.Empty) {}

	// Plays either a file or a tone.
	// Returns 0 if cannot play the sound, otherwise return duration of the audio file or tone in milliseconds
	// (or 0x7FFFFFFF if the tone has no duration limit)
	rpc Play (SoundDescription) returns (Common.Int) {}

	// Stops any audio currently playing
	rpc Stop (google.protobuf.Empty) returns (google.protobuf.Empty) {}

	// Initializes event stream (see "message Event" for the list of events). 
	rpc ReadEvents (google.protobuf.Empty) returns (stream Event) {}
}

message Device {
	string id = 1;
	string name = 2;
	int32 channelCount = 3;
}

message Devices {
	repeated Device items = 1;
}

// Gains for each channel between 0 and 1, or empty array to omit mapping
message ChannelMap {
	repeated float items = 1;
}

message Event {
	oneof value {
		string playbackFinished = 1;
	}
}

enum ToneType {
    Sine = 0;
    Triangle = 1;
    Square = 2;
	SawTooth = 3;
	Sweep = 4;
	Pink = 5;
	White = 6;
}

message ToneDescription {
	ToneType toneType = 1;
	double frequency = 2;
	double gain = 3;
	int32 pulseDuration = 4;
	int32 totalDuration = 5;
	repeated bool channelEnablingMap = 6;
}

message FileDescription {
	string filename = 1;
	repeated bool channelEnablingMap = 2;
}

message SoundDescription {
	string deviceId = 1;
	oneof sound {
		FileDescription file = 2;
		ToneDescription tone = 3;
	}
}